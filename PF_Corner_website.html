<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>PF Corner | Provident Fund Consultancy in Phaltan, Satara</title>
<meta name="description" content="PF Corner helps businesses and employees with PF registration, ECR filing, KYC, withdrawal, transfer and pension planning.">
<meta property="og:type" content="website">
<meta property="og:title" content="PF Corner">
<meta property="og:description" content="Provident Fund consultancy for employers and employees.">
<meta name="theme-color" content="#0b5e63">
<meta name="robots" content="index,follow">
<link rel="canonical" href="">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Noto+Sans+Devanagari:wght@400;500;700;800&display=swap" rel="stylesheet">
<script type="application/ld+json" id="ld"></script>
<style>
/* ============================================================
   1. TOKENS
   ============================================================ */
:root{
  --bg:#f6faf9;--ink:#12262b;--mut:#587075;--brand:#0b5e63;--on:#fff;
  --soft:#e6f3f1;--acc:#f2a900;--card:#fff;--line:#d7e5e3;
  --ok:#137d4f;--warn:#b26a00;--bad:#b3261e;
  --r:14px;--sh:0 10px 30px rgba(10,50,55,.08);--sh2:0 22px 55px rgba(10,50,55,.16);
  --f:Manrope,'Noto Sans Devanagari',system-ui,-apple-system,sans-serif;
  --ease:cubic-bezier(.22,.7,.2,1);
}
[data-theme=indigo]{--bg:#f7f7fd;--ink:#1c1b3a;--mut:#65648a;--brand:#3d3fc4;--soft:#e9e9fb;--acc:#ff7a45;--line:#dcdcf3}
[data-theme=emerald]{--bg:#f5faf4;--ink:#14281a;--mut:#587060;--brand:#1f7a3d;--soft:#e3f3e6;--acc:#e0a800;--line:#d3e6d6}
[data-theme=night]{--bg:#0f1a1e;--ink:#e8f1f2;--mut:#93a9ae;--brand:#4fd1c5;--on:#0f1a1e;--soft:#17282d;--acc:#f6c453;--card:#152227;--line:#25393f;--sh:0 10px 30px rgba(0,0,0,.4);--sh2:0 22px 55px rgba(0,0,0,.55)}

*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:90px}
body{margin:0;font:400 17px/1.65 var(--f);background:var(--bg);color:var(--ink);overflow-x:hidden;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
h1,h2,h3{line-height:1.15;margin:0 0 .5em;letter-spacing:-.02em}
h1{font-size:clamp(2.1rem,5vw,3.5rem);font-weight:800}
h2{font-size:clamp(1.55rem,3vw,2.25rem);font-weight:800}
h3{font-size:1.28rem;font-weight:700}
p{margin:0 0 1em;max-width:68ch}
a{color:var(--brand)}
img{max-width:100%;display:block}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px;border-radius:6px}
html[lang=hi] h1,html[lang=hi] h2,html[lang=hi] h3,html[lang=mr] h1,html[lang=mr] h2,html[lang=mr] h3{line-height:1.4;letter-spacing:0}
.w{max-width:1120px;margin:auto;padding:0 20px}
.sec{padding:76px 0;position:relative}
.skip{position:absolute;left:-999px}.skip:focus{left:8px;top:8px;background:#fff;padding:8px;z-index:99}

/* ============================================================
   2. HEADER / NAV
   ============================================================ */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:color-mix(in srgb,var(--bg) 86%,transparent);
  backdrop-filter:saturate(160%) blur(12px);border-bottom:1px solid var(--line);transition:box-shadow .4s,background .4s}
header.sc{box-shadow:0 8px 28px rgba(10,50,55,.10)}
.bar{display:flex;align-items:center;justify-content:space-between;height:68px;gap:10px}
.brand{font-weight:800;font-size:1.22rem;text-decoration:none;color:var(--ink);display:flex;gap:10px;align-items:center}
.brand span{background:var(--brand);color:var(--on);width:38px;height:38px;border-radius:11px;display:grid;place-items:center;overflow:hidden;
  transition:transform .5s var(--ease),box-shadow .4s}
.brand:hover span{transform:rotate(-8deg) scale(1.08);box-shadow:0 8px 20px color-mix(in srgb,var(--brand) 40%,transparent)}
.brand img{width:100%;height:100%;object-fit:cover}
.brand span svg{width:22px;stroke-width:1.8}
nav{display:flex;gap:4px}
nav a{padding:9px 14px;border-radius:9px;text-decoration:none;color:var(--ink);font-weight:600;position:relative;transition:color .3s,background .3s}
nav a:after{content:"";position:absolute;left:14px;right:14px;bottom:5px;height:2px;background:var(--brand);border-radius:2px;
  transform:scaleX(0);transform-origin:left;transition:transform .35s var(--ease)}
nav a:hover:after,nav a.on:after{transform:scaleX(1)}
nav a:hover,nav a.on{color:var(--brand)}
nav a.on{background:var(--soft)}
#bg{display:none;background:none;border:1px solid var(--line);border-radius:9px;padding:7px 13px;font:600 1rem var(--f);color:var(--ink);cursor:pointer}
.lg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-left:8px}
.lg button{background:none;border:0;padding:7px 11px;font:700 .92rem var(--f);color:var(--ink);cursor:pointer;transition:background .3s,color .3s}
.lg .on{background:var(--brand);color:var(--on)}
#pgbar{position:fixed;top:0;left:0;height:3px;width:0;background:linear-gradient(90deg,var(--brand),var(--acc));z-index:60;transition:width .12s linear}

/* ============================================================
   3. BUTTONS / CARDS
   ============================================================ */
.btn{display:inline-block;background:var(--brand);color:var(--on);border:0;border-radius:11px;padding:13px 25px;
  font:700 1rem var(--f);text-decoration:none;cursor:pointer;position:relative;overflow:hidden;
  transition:transform .35s var(--ease),box-shadow .35s,background .3s,opacity .2s}
.btn:before{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.35),transparent 70%);
  transform:translateX(-120%);transition:transform .7s var(--ease)}
.btn:hover:before{transform:translateX(120%)}
.btn:hover{transform:translateY(-3px);box-shadow:0 12px 26px color-mix(in srgb,var(--brand) 32%,transparent)}
.btn:active{transform:translateY(-1px) scale(.98)}
.btn[disabled]{opacity:.55;cursor:not-allowed;transform:none}
.btn.o{background:none;color:var(--brand);box-shadow:inset 0 0 0 2px var(--brand)}
.btn.o:hover{background:var(--soft)}
.btn+.btn{margin-left:10px}
.btn.sm2{padding:9px 16px;font-size:.9rem;border-radius:9px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:28px;display:flex;flex-direction:column;position:relative;overflow:hidden;
  transition:transform .4s var(--ease),box-shadow .4s,border-color .4s}
.card:hover{transform:translateY(-8px);box-shadow:var(--sh2);border-color:color-mix(in srgb,var(--brand) 35%,var(--line))}
.card .ph{aspect-ratio:16/9;margin-bottom:18px;font-size:2.6rem}
.card .btn{margin-top:auto;text-align:center}
.amt{font-size:1.45rem;font-weight:800;color:var(--brand)}
.ph{aspect-ratio:4/3;border-radius:20px;color:var(--on);display:grid;place-items:center;font-size:4rem;overflow:hidden;
  background:linear-gradient(135deg,var(--brand),color-mix(in srgb,var(--brand) 52%,#000))}
.ph img{width:100%;height:100%;object-fit:cover;transition:transform .7s var(--ease)}
.ph svg{width:30%;height:auto;stroke-width:1.1}
.card .ph svg{width:20%}
.row:hover .ph img,.card:hover .ph img{transform:scale(1.07)}

/* ============================================================
   4. SECTIONS
   ============================================================ */
.hero{padding:88px 0 92px;position:relative;overflow:hidden;background:linear-gradient(160deg,var(--soft),var(--bg) 68%)}
.hero:before,.hero:after{content:"";position:absolute;border-radius:50%;filter:blur(60px);opacity:.5;pointer-events:none}
.hero:before{width:420px;height:420px;top:-140px;right:-90px;background:color-mix(in srgb,var(--brand) 32%,transparent);animation:drift 18s ease-in-out infinite}
.hero:after{width:320px;height:320px;bottom:-130px;left:-80px;background:color-mix(in srgb,var(--acc) 30%,transparent);animation:drift 22s ease-in-out infinite reverse}
@keyframes drift{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(28px,-26px) scale(1.12)}}
.hero .w{display:grid;grid-template-columns:1.12fr .88fr;gap:48px;align-items:center;position:relative;z-index:1}
.lead{font-size:1.18rem;color:var(--mut)}
.stats{display:flex;gap:34px;margin:28px 0}
.stats b{display:block;font-size:2rem;color:var(--brand)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:48px;align-items:center;margin-bottom:56px}
.row:nth-child(even) .ph{order:2}
.price{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
.q{background:var(--brand);color:var(--on);text-align:center;position:relative;overflow:hidden}
.q:before{content:"";position:absolute;inset:0;background:radial-gradient(60% 120% at 50% 0%,rgba(255,255,255,.16),transparent 70%)}
.q .w{position:relative}
.q p{font-size:clamp(1.35rem,3vw,2.1rem);font-weight:700;margin:0 auto 12px;line-height:1.35}
.two{display:grid;grid-template-columns:1fr 1fr;gap:48px}
.eyebrow{color:var(--mut);font-weight:700;margin-bottom:.4em}
form,.box{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:28px;box-shadow:var(--sh)}
label{display:block;font-weight:700;font-size:.9rem;margin:0 0 14px}
input,textarea,select{width:100%;font:inherit;font-family:var(--f);padding:11px 13px;border:1px solid var(--line);border-radius:10px;
  background:var(--bg);color:var(--ink);margin-top:5px;transition:border-color .3s,box-shadow .3s,background .3s}
input:focus,textarea:focus,select:focus{border-color:var(--brand);box-shadow:0 0 0 4px color-mix(in srgb,var(--brand) 14%,transparent);outline:none}
textarea{resize:vertical}
.ci{display:flex;gap:14px}
.ci svg{flex:none;color:var(--brand);margin-top:4px}
.hp{position:absolute!important;left:-9999px!important;width:1px;height:1px;opacity:0}
footer{background:var(--card);border-top:1px solid var(--line);padding:44px 0;color:var(--mut)}
footer .w{display:flex;gap:30px;flex-wrap:wrap;justify-content:space-between}
footer a{color:var(--ink)}
.wa{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));background:#25d366;color:#fff;border-radius:50px;
  padding:12px 18px;font-weight:800;text-decoration:none;box-shadow:0 8px 22px rgba(0,0,0,.25);z-index:35;
  transition:transform .35s var(--ease),box-shadow .35s}
.wa:hover{transform:translateY(-3px) scale(1.04)}
.wa:after{content:"";position:absolute;inset:0;border-radius:50px;box-shadow:0 0 0 0 rgba(37,211,102,.55);animation:pulse 2.6s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 16px rgba(37,211,102,0)}100%{box-shadow:0 0 0 0 rgba(37,211,102,0)}}
#toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:var(--ink);color:var(--bg);
  padding:13px 22px;border-radius:12px;opacity:0;pointer-events:none;z-index:70;max-width:90vw;box-shadow:var(--sh2);
  transition:opacity .3s,transform .3s var(--ease);font-weight:600}
#toast.show{opacity:1;transform:translate(-50%,0)}
#toast.ok{background:var(--ok);color:#fff}#toast.bad{background:var(--bad);color:#fff}

/* ============================================================
   5. ANIMATION SYSTEM (applied to every section by default)
   ============================================================ */
body{animation:fadeIn .6s ease}
@keyframes fadeIn{from{opacity:0}}
#app{transition:opacity .24s ease,transform .24s ease}
#app.out{opacity:0;transform:translateY(14px)}
.hl{animation:rise .95s var(--ease) both;animation-delay:var(--d,0s)}
@keyframes rise{from{opacity:0;transform:translateY(30px)}}
.rv{opacity:0;transition:opacity .85s var(--ease) var(--d,0s),transform .85s var(--ease) var(--d,0s),filter .85s var(--ease) var(--d,0s)}
.rv[data-rv=up]{transform:translateY(36px)}
.rv[data-rv=left]{transform:translateX(-42px)}
.rv[data-rv=right]{transform:translateX(42px)}
.rv[data-rv=zoom]{transform:scale(.93)}
.rv[data-rv=blur]{transform:translateY(22px);filter:blur(10px)}
.rv[data-rv=fade]{transform:none}
.rv.in{opacity:1;transform:none;filter:none}
@media(prefers-reduced-motion:reduce){
  *{scroll-behavior:auto!important}
  .rv,.hl{opacity:1!important;transform:none!important;filter:none!important;animation:none!important;transition:none!important}
  body,#app,.hero:before,.hero:after,.wa:after{animation:none!important;transition:none!important}
}

/* ============================================================
   6. ADMIN PANEL
   ============================================================ */
.adm{display:grid;grid-template-columns:232px 1fr;gap:26px;padding:26px 0 60px;align-items:start}
.side{position:sticky;top:86px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:var(--sh)}
.side h4{margin:4px 8px 10px;font:800 .72rem/1 var(--f);letter-spacing:.09em;color:var(--mut)}
.tabs{display:flex;flex-direction:column;gap:4px}
.tabs button,.tabs a{display:flex;align-items:center;gap:9px;text-align:left;padding:10px 13px;border:0;border-radius:10px;background:none;
  font:600 .95rem var(--f);color:var(--ink);cursor:pointer;text-decoration:none;transition:background .25s,color .25s,transform .25s}
.tabs button:hover,.tabs a:hover{background:var(--soft);transform:translateX(3px)}
.tabs button.on{background:var(--brand);color:var(--on)}
.tabs button.on svg{color:var(--on)}
.tabs svg{flex:none;color:var(--brand);width:18px;height:18px}
.tabs .sep{height:1px;background:var(--line);margin:8px 4px}
.pnl{min-width:0}
.ah{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:6px}
.ah h2{margin:0 0 4px}
.ah .sub{color:var(--mut);font-size:.94rem;margin:0}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px;margin:16px 0;box-shadow:var(--sh)}
.panel>h3{margin-top:0;display:flex;align-items:center;gap:8px}
.panel .hint{color:var(--mut);font-size:.88rem;margin:-6px 0 16px}
/* tab strips: level 1 (page) and level 2 (section) */
.strip{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.strip button{padding:9px 16px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);
  font:700 .92rem var(--f);cursor:pointer;transition:all .28s var(--ease)}
.strip button:hover{border-color:var(--brand);transform:translateY(-2px)}
.strip button.on{background:var(--brand);color:var(--on);border-color:var(--brand);box-shadow:0 8px 18px color-mix(in srgb,var(--brand) 28%,transparent)}
.strip.l2{background:var(--soft);padding:8px;border-radius:12px}
.strip.l2 button{background:transparent;border-color:transparent;font-weight:600}
.strip.l2 button.on{background:var(--card);color:var(--brand);border-color:var(--line);box-shadow:var(--sh)}
.strip.l3{margin-bottom:18px}
.strip.l3 button{border-radius:999px;padding:7px 14px;font-size:.86rem}
.crumb{color:var(--mut);font-size:.85rem;margin:0 0 12px;font-weight:600}
fieldset{border:1px solid var(--line);border-radius:12px;margin:0 0 16px;padding:14px 16px;background:var(--bg)}
legend{font-weight:800;text-transform:capitalize;padding:0 8px;font-size:.92rem}
.item{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-top:12px;background:var(--card)}
.item>b{display:block;margin-bottom:8px;color:var(--brand);font-size:.85rem;letter-spacing:.02em}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 18px}
.pv{width:64px;height:64px;object-fit:cover;border-radius:10px;border:1px solid var(--line);margin:6px 0}
.sm{font:600 .85rem var(--f);padding:7px 13px;border-radius:9px;border:1px solid var(--line);background:var(--card);color:var(--ink);
  cursor:pointer;transition:all .25s var(--ease)}
.sm:hover{border-color:var(--brand);color:var(--brand);transform:translateY(-1px)}
.sm.dg:hover{border-color:var(--bad);color:var(--bad)}
.th{display:flex;gap:12px;flex-wrap:wrap}
.th button{padding:14px 22px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink);
  font:700 1rem var(--f);cursor:pointer;text-transform:capitalize;transition:all .3s var(--ease)}
.th button:hover{transform:translateY(-3px);box-shadow:var(--sh)}
.th .on{border-color:var(--brand);color:var(--brand)}
.note{background:var(--soft);border-left:4px solid var(--acc);padding:12px 16px;border-radius:10px;font-size:.9rem;margin-bottom:16px}
.note.ok{border-left-color:var(--ok)}.note.bad{border-left-color:var(--bad)}
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:18px}
.kpi div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;box-shadow:var(--sh);
  transition:transform .3s var(--ease)}
.kpi div:hover{transform:translateY(-4px)}
.kpi b{display:block;font-size:1.9rem;font-weight:800;color:var(--brand);line-height:1.1}
.kpi span{color:var(--mut);font-size:.86rem;font-weight:600}
.tbl{width:100%;border-collapse:collapse;font-size:.92rem}
.tbl th{text-align:left;font-weight:700;color:var(--mut);font-size:.78rem;letter-spacing:.05em;padding:8px 10px;border-bottom:1px solid var(--line)}
.tbl td{padding:11px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl tr{transition:background .25s}
.tbl tbody tr:hover{background:var(--soft)}
.scrollx{overflow-x:auto;-webkit-overflow-scrolling:touch}
.tag{display:inline-block;padding:3px 10px;border-radius:999px;font:700 .74rem var(--f);letter-spacing:.02em}
.tag.new{background:color-mix(in srgb,var(--acc) 22%,transparent);color:var(--warn)}
.tag.contacted{background:color-mix(in srgb,var(--brand) 16%,transparent);color:var(--brand)}
.tag.done{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.tag.off{background:var(--soft);color:var(--mut)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:middle}
.dot.g{background:var(--ok)}.dot.r{background:var(--bad)}.dot.y{background:var(--acc)}
.acts{display:flex;gap:6px;flex-wrap:wrap}
.sw{display:flex;align-items:center;gap:10px;font-weight:700;font-size:.92rem;margin-bottom:12px;cursor:pointer}
.sw input{width:auto;margin:0;appearance:none;width:44px;height:25px;border-radius:999px;background:var(--line);position:relative;
  cursor:pointer;transition:background .3s;flex:none}
.sw input:after{content:"";position:absolute;top:3px;left:3px;width:19px;height:19px;border-radius:50%;background:#fff;
  transition:transform .3s var(--ease);box-shadow:0 2px 5px rgba(0,0,0,.2)}
.sw input:checked{background:var(--brand)}
.sw input:checked:after{transform:translateX(19px)}
.lg-box{max-width:430px;margin:0 auto}
.lock{color:var(--bad);font-weight:700}
.sess{font-size:.8rem;color:var(--mut);padding:8px 10px;text-align:center}
.fade-up{animation:rise .5s var(--ease) both}

@media(max-width:900px){
  .adm{grid-template-columns:1fr}
  .side{position:static}
  .tabs{flex-direction:row;flex-wrap:wrap}
  .tabs button,.tabs a{flex:1 1 auto;justify-content:center}
  .tabs .sep{display:none}
  .grid2{grid-template-columns:1fr}
}
@media(max-width:820px){
  #bg{display:block}
  nav{display:none;position:absolute;top:68px;left:0;right:0;background:var(--bg);flex-direction:column;padding:12px 20px;
    border-bottom:1px solid var(--line);box-shadow:var(--sh);animation:rise .35s var(--ease) both}
  nav.open{display:flex}
  nav a:after{display:none}
  .hero .w,.row,.two,.price{grid-template-columns:1fr}
  .row:nth-child(even) .ph{order:0}
  .sec,.hero{padding:52px 0}
  .lg{order:2;margin-left:auto;margin-right:6px}
  #bg{order:3}
  .stats{gap:22px}
}
</style>
</head>
<body>
<div id="pgbar"></div>
<a class="skip" href="#app">Skip to main content</a>
<header><div class="w bar" id="hd"></div></header>
<main id="app"><noscript><div class="w sec"><h1>PF Corner</h1><p>Provident Fund consultancy: PF withdrawal, KYC verification, PF transfer and pension planning. Call 8380920789 or email pfcorner100@gmail.com. Please enable JavaScript to view the full site.</p></div></noscript></main>
<footer><div class="w" id="ft"></div></footer>
<div id="toast" role="status" aria-live="polite"></div>
<script>
/* ============================================================================
   PF CORNER — single file website + admin panel
   Sections:  1 helpers · 2 icons/translations · 3 default content · 4 state
              5 notifications · 6 public pages · 7 animations · 8 admin panel
              9 session & events
   ========================================================================== */

/* ---------- 1. HELPERS ---------------------------------------------------- */
const K = 'pfc_site_v2';
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => '&#' + c.charCodeAt(0) + ';');
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const nowISO = t => new Date(t).toLocaleString('en-IN', { dateStyle: 'medium', timeStyle: 'short' });

const toast = (m, kind) => {
  const t = $('#toast');
  t.textContent = m;
  t.className = 'show' + (kind ? ' ' + kind : '');
  clearTimeout(toast.t);
  toast.t = setTimeout(() => { t.className = ''; }, 4600);
};

/* works in every browser, including ones without structuredClone */
const clone = o => (typeof structuredClone === 'function' ? structuredClone(o) : JSON.parse(JSON.stringify(o)));

const sha = async s => {
  try {
    const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s));
    return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join('');
  } catch (e) { return 'b64:' + btoa(unescape(encodeURIComponent(s))); }
};

/* keys that are never translated — they are shared from the English record */
const NT = /^(img|photo|logo|icon|heroImg|phone|email|whatsapp|facebook|instagram)$/i;

function sync(t, e) { /* make sure a translation record has the same shape as English */
  for (const k in e) {
    if (NT.test(k)) continue;
    const v = e[k];
    if (Array.isArray(v)) { t[k] = t[k] || []; v.forEach((it, i) => { t[k][i] = t[k][i] || {}; sync(t[k][i], it); }); }
    else if (v && typeof v === 'object') { t[k] = t[k] || {}; sync(t[k], v); }
    else if (t[k] == null) t[k] = '';
  }
}
function mg(e, t) { /* merge English + translation, empty translation falls back to English */
  if (!t) return e;
  if (Array.isArray(e)) return e.map((x, i) => mg(x, t[i]));
  if (e && typeof e === 'object') { const o = {}; for (const k in e) o[k] = mg(e[k], t[k]); return o; }
  return t === '' || t == null ? e : t;
}
function dm(d, t) { /* fill missing keys of a saved record from the defaults */
  for (const k in d) {
    if (t[k] == null) t[k] = clone(d[k]);
    else if (!Array.isArray(d[k]) && d[k] && typeof d[k] === 'object') dm(d[k], t[k]);
  }
}

const apiBase = () => (S.cfg.server.base || '').trim().replace(/\/+$/, '');
const hasServer = () => !!apiBase();

async function api(path, body, auth) {
  const base = apiBase();
  if (!base) throw new Error('No server URL is set in Notifications.');
  const h = { 'Content-Type': 'application/json' };
  if (auth) h.Authorization = 'Bearer ' + (S.cfg.server.token || '');
  const r = await fetch(base + path, {
    method: 'POST', headers: h, body: JSON.stringify(body || {})
  });
  let d = {};
  try { d = await r.json(); } catch (e) {}
  if (!r.ok) throw new Error(d.error || ('Server replied ' + r.status));
  return d;
}

}

/* Sends the enquiry everywhere the admin has switched on.
   With a server configured it is one call and e-mail (Gmail app password),
   WhatsApp and SMS all go out from there. Without a server the browser can
   still fire the WhatsApp Cloud API / Telegram, and otherwise falls back to
   opening a pre-filled WhatsApp chat. */
async function notify(lead, isTest) {
  const out = { email: 'off', customer: 'off', whatsapp: 'off', sms: 'off', telegram: 'off' };
  const c = S.cfg;

  if (hasServer()) {
    try {
      const d = await api('/api/lead', { lead, test: !!isTest, site: S.c.site });
      Object.assign(out, d.channels || {});
      return { ok: true, channels: out, via: 'server' };
    } catch (e) {
      out.email = 'failed: ' + e.message;
    }
  } else if (c.email.enabled) {
    out.email = 'needs server';
    out.customer = 'needs server';
  }

  /* browser-side fallbacks */
  const txt = leadText(lead);
  if (c.whatsapp.enabled && c.whatsapp.mode === 'cloud' && c.whatsapp.token && c.whatsapp.phoneId && c.whatsapp.adminNumber) {
    try {
      const r = await fetch('https://graph.facebook.com/v20.0/' + c.whatsapp.phoneId + '/messages', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + c.whatsapp.token },
        body: JSON.stringify({ messaging_product: 'whatsapp', to: c.whatsapp.adminNumber, type: 'text', text: { body: txt } })
      });
      out.whatsapp = r.ok ? 'sent' : 'failed (' + r.status + ')';
    } catch (e) { out.whatsapp = 'blocked by browser'; }
  }
  if (c.telegram.enabled && c.telegram.botToken && c.telegram.chatId) {
    try {
      const r = await fetch('https://api.telegram.org/bot' + c.telegram.botToken + '/sendMessage', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ chat_id: c.telegram.chatId, text: txt })
      });
      out.telegram = r.ok ? 'sent' : 'failed (' + r.status + ')';
    } catch (e) { out.telegram = 'blocked by browser'; }
  }
  let waLink = '';
  if (c.whatsapp.enabled && c.whatsapp.mode === 'link' && out.whatsapp === 'off' && !isTest) {
    const n = (c.whatsapp.adminNumber || S.c.site.whatsapp || '').replace(/\D/g, '');
    if (n) {
      waLink = 'https://wa.me/' + n + '?text=' + encodeURIComponent(txt);
      const win = window.open(waLink, '_blank', 'noopener');
      out.whatsapp = win ? 'chat opened' : 'popup blocked';
    }
  }
  const good = Object.values(out).some(v => /sent|opened|queued/i.test(v));
  return { ok: good, channels: out, via: 'browser', waLink: out.whatsapp === 'popup blocked' ? waLink : '' };
}

async function submitLead(v) {
  const lead = {
    id: uid(), ts: Date.now(), name: v.name.trim(), phone: v.phone.trim(),
    email: (v.email || '').trim(), msg: v.msg.trim(), lang: LANG,
    status: 'new', note: '', channels: {}
  };
  S.leads.unshift(lead);
  if (S.leads.length > 400) S.leads.length = 400;
  save();
  let res = { ok: false, channels: {} };
  try { res = await notify(lead); } catch (e) { res.channels = { email: 'failed: ' + e.message }; }
  lead.channels = res.channels;
  save();
  return res;
}

/* ---------- 7. ANIMATIONS ---------- */
const reduced = () => matchMedia('(prefers-reduced-motion:reduce)').matches;

function countUp(b) {
  const t = b.textContent.trim();
  if (reduced() || !/[0-9०-९१-९]/.test(t)) return;
  const digits = t.replace(/[^\d]/g, '');
  if (!digits) return;                       /* Devanagari numerals: leave as is */
  const n = +digits, suffix = t.replace(/[\d,]/g, '');
  let s0;
  const step = ts => {
    s0 = s0 || ts;
    const p = Math.min((ts - s0) / 1200, 1);
    b.textContent = Math.round(n * (1 - Math.pow(1 - p, 3))).toLocaleString('en-IN') + suffix;
    if (p < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

/* every section on every page is animated by default */
function fx() {
  const app = $('#app');
  if (!app) return;
  if (location.hash === '#/admin') return;   /* admin panel stays calm */

  /* hero: orchestrated entrance */
  $$('.hero .w>div:first-child>*, .hero .ph').forEach((e, i) => {
    e.classList.add('hl');
    e.style.setProperty('--d', (i * .11) + 's');
  });
  $$('.hero .cn').forEach(countUp);

  if (reduced() || !('IntersectionObserver' in window)) return;

  const io = new IntersectionObserver(entries => {
    entries.forEach(o => {
      if (!o.isIntersecting) return;
      o.target.classList.add('in');
      io.unobserve(o.target);
      if (o.target.classList.contains('cn')) countUp(o.target);
    });
  }, { threshold: .12, rootMargin: '0px 0px -40px 0px' });

  /* default reveal recipe per element type */
  const plan = [
    ['.sec>.w>h1, .sec>.w>h2', 'up', 0],
    ['.sec .two>div', 'up', .08],
    ['.sec .row', 'up', .05],
    ['.sec .card', 'zoom', .1],
    ['.q .w>*', 'blur', .1],
    ['.sec form', 'right', 0],
    ['.sec .ci', 'left', .07],
    ['.panel', 'up', .05]
  ];
  plan.forEach(([sel, kind, step]) => {
    app.querySelectorAll(sel).forEach(e => {
      if (e.dataset.rv) return;
      const i = [...e.parentNode.children].indexOf(e);
      e.dataset.rv = kind;
      e.classList.add('rv');
      e.style.setProperty('--d', (Math.min(i, 5) * step) + 's');
      io.observe(e);
    });
  });
  /* alternate direction for the stacked service rows */
  app.querySelectorAll('.sec .row').forEach((e, i) => { e.dataset.rv = i % 2 ? 'right' : 'left'; });
  /* anything left inside a section that was not matched */
  app.querySelectorAll('.sec>.w>p, .sec .stats').forEach(e => {
    if (e.dataset.rv) return;
    e.dataset.rv = 'fade'; e.classList.add('rv'); io.observe(e);
  });
  app.querySelectorAll('.cn').forEach(e => io.observe(e));
}

/* ---- one form control for one value ---- */
function one(key, v, path, label) {
  const L = esc(label || lab(key)), q = esc(path), val = v == null ? '' : String(v);

  /* icon chooser */
  if (/^(icon|logo)$/i.test(key) && !/^(https?:|data:)/.test(val)) {

  }

  if (/img|photo|logo|icon/i.test(key)) {
    const uploaded = val.startsWith('data:');
    return '<label>' + L + ' <span style="font-weight:500;color:var(--mut)">(image link, or upload below)</span>' +
      '<input data-p="' + q + '" value="' + esc(uploaded ? '(uploaded image)' : val) + '" ' + (uploaded ? 'readonly' : '') + '>' +
      '</label>' +
      (/^(https?:|data:)/.test(val) ? '<img class="pv" src="' + esc(val) + '" alt="">' : '') +
      '<label style="font-weight:500;font-size:.84rem">Upload a file<input type="file" accept="image/*" data-up="' + q + '"></label>' +
      (uploaded ? '<button class="sm dg" data-clr="' + q + '">Remove uploaded image</button>' : '');
  }
  const secret = /pass|token|apikey|^sid$|^key$/i.test(key);
  const long = val.length > 80 || /text$|^welcome[12]$|description|body|address|quote$|^msg$|^sub$/i.test(key);
  if (long) return '<label>' + L + '<textarea rows="' + (val.length > 260 ? 6 : 4) + '" data-p="' + q + '">' + esc(val) + '</textarea></label>';
  return '<label>' + L + '<input data-p="' + q + '" value="' + esc(val) + '"' + (secret ? ' type="password" autocomplete="off"' : '') + '></label>';
}

/* ---- recursive editor (objects / arrays) ---- */
function ed(o, p, opt) {
  opt = opt || {};
  const locked = p.startsWith('tr.');          /* translation record: images & links are shared */
  let h = '';
  for (const k in o) {
    if (locked && NT.test(k)) continue;
    const v = o[k], q = p + '.' + k;
    if (Array.isArray(v)) {
      h += '<fieldset><legend>' + esc(lab(k)) + '</legend>' +
        v.map((it, i) =>
          '<div class="item"><b>Item ' + (i + 1) + '</b>' +
          (locked ? '' : '<button class="sm dg" style="float:right;margin-top:-30px" data-del="' + q + '.' + i + '">Remove</button>') +
          ed(it, q + '.' + i, opt) + '</div>').join('') +
        (locked ? '' : '<br><button class="sm" data-add="' + q + '">Add item</button>') +
        '</fieldset>';
    } else if (v && typeof v === 'object') {
      h += '<fieldset><legend>' + esc(lab(k)) + '</legend>' + ed(v, q, opt) + '</fieldset>';
    } else {
      h += one(k, v, q, opt.labels && opt.labels[k]);
    }
  }
  return h;
}

/* renders whatever sits at a path: single value, object or list */
function fld(path, label) {
  const v = get(path);
  if (v === undefined) return '';
  const key = path.split('.').pop();
  const locked = path.startsWith('tr.');
  if (locked && NT.test(key)) return '';
  if (Array.isArray(v)) {
    return '<fieldset><legend>' + esc(label || lab(key)) + '</legend>' +
      v.map((it, i) =>
        '<div class="item"><b>Item ' + (i + 1) + '</b>' +
        (locked ? '' : '<button class="sm dg" style="float:right;margin-top:-30px" data-del="' + path + '.' + i + '">Remove</button>') +
        ed(it, path + '.' + i) + '</div>').join('') +
      (locked ? '' : '<br><button class="sm" data-add="' + path + '">Add item</button>') +
      '</fieldset>';
  }
  if (v && typeof v === 'object') {
    return '<fieldset><legend>' + esc(label || lab(key)) + '</legend>' + ed(v, path) + '</fieldset>';
  }
  return one(key, v, path, label);
}

/* ---------- 9. SESSION ---------- */
const SES = {
  key: 'pfc_ses',
  ms() { return (+S.security.idleMinutes || 20) * 60000; },
  get() {
    try {
      const s = JSON.parse(sessionStorage.getItem(this.key) || 'null');
      if (!s) return null;
      if (Date.now() > s.exp) { sessionStorage.removeItem(this.key); return null; }
      return s;
    } catch (e) { return null; }
  },
  start(t) { sessionStorage.setItem(this.key, JSON.stringify({ t: t || 'local', exp: Date.now() + this.ms() })); },
  touch() { const s = this.get(); if (s) { s.exp = Date.now() + this.ms(); sessionStorage.setItem(this.key, JSON.stringify(s)); } },
  end() { sessionStorage.removeItem(this.key); }
};
const LK = 'pfc_lock';
function lockLeft() {
  try { const l = JSON.parse(localStorage.getItem(LK) || '{}'); if (l.until > Date.now()) return Math.ceil((l.until - Date.now()) / 1000); } catch (e) {}
  return 0;
}
function lockFail() {
  let l = {};
  try { l = JSON.parse(localStorage.getItem(LK) || '{}'); } catch (e) {}
  l.n = (l.n || 0) + 1;
  if (l.n >= 5) { l.until = Date.now() + 60000; l.n = 0; }
  try { localStorage.setItem(LK, JSON.stringify(l)); } catch (e) {}
}
const lockClear = () => { try { localStorage.removeItem(LK); } catch (e) {} };

function sessTick() {
  const n = $('#sess');
  if (!n) return;
  const s = SES.get();
  n.textContent = s ? 'Session ends in ' + Math.max(0, Math.round((s.exp - Date.now()) / 60000)) + ' min' : '';
}
setInterval(() => {
  const admin = location.hash === '#/admin';
  if (admin && !SES.get() && $('#login') === null) { A.expired = 1; render(); }
  sessTick();
}, 15000);
['click', 'keydown', 'scroll'].forEach(ev =>
  addEventListener(ev, () => { if (location.hash === '#/admin') SES.touch(); }, { passive: true }));

/* ---------- utilities ---------- */
function shrink(f, cb) {
  if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    const i = new Image();
    i.onload = () => {
      const s = Math.min(1, 1100 / Math.max(i.width, i.height));
      const c = document.createElement('canvas');
      c.width = Math.round(i.width * s); c.height = Math.round(i.height * s);
      c.getContext('2d').drawImage(i, 0, 0, c.width, c.height);
      cb(c.toDataURL('image/jpeg', .82));
    };
    i.onerror = () => toast('That file is not an image.', 'bad');
    i.src = r.result;
  };
  r.readAsDataURL(f);
}
function dl(blob, name) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}
function exportCSV() {
  const head = ['Date', 'Name', 'Phone', 'Email', 'Language', 'Status', 'Message'];
  const rows = [head].concat(S.leads.map(l => [nowISO(l.ts), l.name, l.phone, l.email, l.lang, l.status, l.msg]));
  const body = rows.map(r => r.map(c => '"' + String(c ?? '').replace(/"/g, '""') + '"').join(',')).join('\r\n');
  dl(new Blob(['\ufeff' + body], { type: 'text/csv;charset=utf-8' }), 'pf-corner-enquiries.csv');
}

/* ---------- router ---------- */
function draw() {
  X = mg(S.c, LANG === 'en' ? null : S.tr[LANG]);

  chrome();
  $('#app').innerHTML = pages[k || 'home']();
  seo(k || 'home');
  if (!render.keep) scrollTo({ top: 0, behavior: 'instant' });
  render.keep = 0;
  fx();
  sessTick();
}
function render(fade) {
  if (!render.done || !fade) { render.done = 1; draw(); return; }
  const a = $('#app');
  a.classList.add('out');
  setTimeout(() => { draw(); a.classList.remove('out'); }, 235);
}
function keep() {
  const y = scrollY;
  render.keep = 1;
  render();
  scrollTo({ top: y, behavior: 'instant' });
}
addEventListener('hashchange', () => render(1));
addEventListener('scroll', () => {
  $('header').classList.toggle('sc', scrollY > 10);
  const h = document.documentElement.scrollHeight - innerHeight;
  $('#pgbar').style.width = (h > 0 ? (scrollY / h) * 100 : 0) + '%';
}, { passive: true });

/* ---------- clicks ---------- */
document.addEventListener('click', async e => {
  const t = e.target.closest('[data-tab],[data-tabgo],[data-lang],[data-lang2],[data-cpage],[data-csec],[data-lf],[data-open],[data-del-lead],[data-clear-leads],[data-csv],[data-theme-set],[data-accent-reset],[data-out],[data-add],[data-del],[data-clr],[data-test],[data-push],[data-ping],[data-pw],[data-exp],[data-reset],#bg') || e.target;
  const d = t.dataset || {};

  if (t.id === 'bg') { const n = $('#nv').classList.toggle('open'); t.setAttribute('aria-expanded', n); return; }
  if (e.target.closest('nav a') && $('#nv')) $('#nv').classList.remove('open');

  if (d.tab) { A.tab = d.tab; keep(); }
  if (d.tabgo) { A.tab = d.tabgo; keep(); }
  if (d.lang) { LANG = d.lang; try { localStorage.pfc_lang = LANG; } catch (x) {} render.keep = 1; render(1); }
  if (d.lang2) { A.lang = d.lang2; keep(); }
  if (d.cpage) { A.page = d.cpage; keep(); }
  if (d.csec) { A.sec[A.page] = d.csec; keep(); }
  if (d.lf) { A.filter = d.lf; keep(); }
  if (d.open !== undefined && d.open) { A.open = A.open === d.open ? '' : d.open; keep(); }

  if (d.delLead) {
    if (!confirm('Delete this enquiry? It cannot be undone.')) return;
    S.leads = S.leads.filter(l => l.id !== d.delLead); save(); keep(); toast('Enquiry deleted.');
  }
  if (d.clearLeads !== undefined) {
    if (!confirm('Delete every enquiry? Download a CSV first if you need them.')) return;
    S.leads = []; save(); keep(); toast('All enquiries removed.');
  }
  if (d.csv !== undefined) { exportCSV(); toast('CSV downloaded.', 'ok'); }

  if (d.themeSet) { S.theme = d.themeSet; save(); keep(); }
  if (d.accentReset !== undefined) { S.accent = ''; save(); keep(); }
  if (d.out !== undefined) { SES.end(); A.tab = 'dash'; keep(); toast('Signed out.'); }

  if (d.add) {
    const arr = get(d.add);
    const blank = clone(arr[0]);
    (function z(o) { for (const k in o) { if (o[k] && typeof o[k] === 'object') z(o[k]); else o[k] = ''; } })(blank);
    arr.push(blank); save(); keep();
  }
  if (d.del) {
    const a = d.del.split('.'), i = +a.pop(), arr = get(a.join('.'));
    if (arr.length < 2) return toast('Keep at least one item.');
    if (!confirm('Remove this item?')) return;
    if (a[0] === 'c') for (const l of ['mr', 'hi']) {
      try { const tr = get('tr.' + l + '.' + a.slice(1).join('.')); if (Array.isArray(tr)) tr.splice(i, 1); } catch (x) {}
    }
    arr.splice(i, 1); save(); keep();
  }
  if (d.clr) { set(d.clr, ''); keep(); }

  /* ---- notification actions ---- */
  if (d.ping !== undefined) {
    if (!hasServer()) return toast('Add the server address first.', 'bad');
    try { const r = await api('/api/health', {}); toast('Server is running. ' + (r.version ? 'Version ' + r.version + '. ' : '') + (r.mailReady ? 'Mail is configured.' : 'Mail is not configured yet.'), 'ok'); }
    catch (err) { toast('Could not reach the server: ' + err.message, 'bad'); }
  }
  if (d.push !== undefined) {
    if (!hasServer()) return toast('Add the server address first.', 'bad');
    try {
      await api('/api/config', { config: S.cfg }, true);
      S.cfg.email.appPassword = ''; S.cfg.whatsapp.token = '';
      S.cfg.sms.token = ''; S.cfg.sms.apiKey = ''; S.cfg.telegram.botToken = '';
      save(); keep();
      toast('Settings saved on the server. Secrets were cleared from this browser.', 'ok');
    } catch (err) { toast('Could not save: ' + err.message, 'bad'); }
  }
  if (d.test) {
    const sample = { id: 'test', ts: Date.now(), name: 'Test enquiry', phone: S.c.site.phone, email: S.cfg.email.adminTo || S.c.site.email, msg: 'This is a test message sent from the PF Corner admin panel.', lang: 'en', status: 'new' };
    t.disabled = true;
    try {
      if (d.test === 'all') {
        const r = await notify(sample, true);
        toast(Object.keys(r.channels).map(k => k + ': ' + r.channels[k]).join(' · '), r.ok ? 'ok' : 'bad');
      } else if (hasServer()) {
        const r = await api('/api/test', { channel: d.test, lead: sample }, true);
        toast(r.message || 'Test sent.', r.ok ? 'ok' : 'bad');
      } else if (d.test === 'whatsapp' || d.test === 'telegram') {
        const r = await notify(sample, false);
        toast(d.test + ': ' + (r.channels[d.test] || 'off'), r.ok ? 'ok' : 'bad');
      } else {
        toast('Email and SMS need the helper server. Add its address above.', 'bad');
      }
    } catch (err) { toast('Test failed: ' + err.message, 'bad'); }
    t.disabled = false;
  }

  /* ---- account ---- */
  if (d.pw !== undefined) {
    const v = $('#np').value, v2 = $('#np2').value;
    if (v.length < 8) return toast('Use at least 8 characters.', 'bad');
    if (v !== v2) return toast('The two passwords do not match.', 'bad');
    S.pw = await sha(v); save(); lockClear();
    $('#np').value = ''; $('#np2').value = '';
    toast('Password changed. Use it the next time you sign in.', 'ok');
  }
  if (d.exp !== undefined) {
    dl(new Blob([JSON.stringify(S, null, 1)], { type: 'application/json' }), 'pf-corner-backup.json');
    toast('Backup downloaded.', 'ok');
  }
  if (d.reset !== undefined) {
    if (!confirm('Reset all content, design and settings back to the original? Enquiries are kept.')) return;
    const pw = S.pw, leads = S.leads;
    S = DEF(); S.pw = pw; S.leads = leads; save(); keep();
    toast('Content reset.', 'ok');
  }
});

/* ---------- typing ---------- */
let qTimer;
document.addEventListener('input', e => {
  const t = e.target;

/* ---------- selects, switches, files ---------- */
document.addEventListener('change', e => {
  const t = e.target, d = t.dataset;
  if (d.p !== undefined && t.tagName === 'SELECT') {
    set(d.p, t.value);
    if (/mode|provider|idleMinutes|icon|logo/.test(d.p)) keep();
  }
  if (d.sw !== undefined) { set(d.sw, t.checked); keep(); }
  if (d.st !== undefined) {
    const l = S.leads.find(x => x.id === d.st);
    if (l) { l.status = t.value; save(); keep(); toast('Marked as ' + t.value + '.'); }
  }
  if (d.up !== undefined && t.files[0]) shrink(t.files[0], u => { set(d.up, u); keep(); toast('Image added.', 'ok'); });
  if (d.imp !== undefined && t.files[0]) {
    t.files[0].text().then(x => {
      try {
        const o = JSON.parse(x);
        if (!o || !o.c) throw 0;
        S = o; dm(DEF(), S); if (!Array.isArray(S.leads)) S.leads = [];
        save(); keep(); toast('Backup restored.', 'ok');
      } catch (err) { toast('That file is not a PF Corner backup.', 'bad'); }
    });
  }
});

/* ---------- forms ---------- */
document.addEventListener('submit', async e => {
  e.preventDefault();
  const f = e.target, v = Object.fromEntries(new FormData(f));

  if (f.id === 'lead') {
    if (v.company) return;                                  /* honeypot: silent drop */
    const msgBox = $('#lmsg');
    const phone = (v.phone || '').replace(/\D/g, '');
    if (!v.name || v.name.trim().length < 2) return (msgBox.textContent = 'Please enter your name.');
    if (phone.length < 10) return (msgBox.textContent = 'Please enter a valid phone number.');
    if (v.email && !/^[^@\s]+@[^@\s]+\.[^@\s]{2,}$/.test(v.email)) return (msgBox.textContent = 'Please check the email address.');
    if (!v.msg || v.msg.trim().length < 5) return (msgBox.textContent = 'Please tell us a little about what you need.');

    const b = f.querySelector('button');
    b.disabled = true; b.textContent = '…'; msgBox.textContent = '';
    const res = await submitLead(v);
    b.disabled = false; b.textContent = X.contact.btn;
    f.reset();
    toast(X.ui.thanks, 'ok');
    msgBox.textContent = X.ui.thanks;
    if (res.waLink) {
      msgBox.innerHTML = esc(X.ui.thanks) +
        ' <a href="' + esc(res.waLink) + '" target="_blank" rel="noopener">' + esc(X.ui.chat) + '</a>';
    }
  }

  if (f.id === 'login') {
    if (lockLeft()) return toast('Too many attempts. Wait ' + lockLeft() + ' seconds.', 'bad');
    const h = await sha(v.p);
    const okLocal = v.u === 'admin' && (S.pw ? h === S.pw : v.p === 'admin@123');
    if (!okLocal) { lockFail(); keep(); return toast('Wrong username or password.', 'bad'); }
    lockClear();
    let token = 'local';
    if (hasServer()) {
      try { const r = await api('/api/login', { user: v.u, pass: v.p }); if (r.token) { token = r.token; S.cfg.server.token = r.token; save(); } }
      catch (err) { /* the local password still governs this panel */ }
    }
    SES.start(token);
    A.tab = 'dash';
    keep();
    toast('Welcome back.', 'ok');
  }
});

render();
